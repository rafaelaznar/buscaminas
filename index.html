<html>

<head>
    <title>Buscaminas</title>
    <style>
        /* aqui van los estilos de la página */
        h1 {
            color: green;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        p {
            color: blue;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* tipo de letra para el texto de los botones del tablero */
        button {
            font-family: 'Courier New', Courier, monospace;
            width: 50px;
            height: 50px;
        }

        #tablero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        }

        .water {
            background-color: lightblue;
            border: 3px solid blue;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* clase para los botones marcados con @ */
        .marcada {
            background-color: yellow;
        }
    </style>
</head>

<body>
    <h1>Buscaminas</h1>
    <p>Gess mine: shift + click / Gess water: click</p>
    <p>Good luck</p>
    <div id="tablero">
        <!-- aquí se generará el tablero con JavaScript -->
    </div>
    <script>
        gamaAzules = [
            "809fff",
            "637bc4",
            "495d9a",
            "27408c",
            "162e76",
            "071b58",
            "041340",
            "000410"
        ];
        // aquí va el código de JavaScript
        // generar el tablero con JavaScript
        // crear una matriz de 10x10 con ceros
        var tablero = [];
        for (var i = 0; i < 10; i++) {
            tablero[i] = [];
            for (var j = 0; j < 10; j++) {
                tablero[i][j] = 0;
            }
        }
        // colocar 10 minas en posiciones aleatorias
        var i = 0;
        while (i < 10) {
            var fila = Math.floor(Math.random() * 10);
            var columna = Math.floor(Math.random() * 10);
            // si ya hay una mina en esa posición, restar 1 a i para intentar de nuevo
            if (tablero[fila][columna] === 9) {
            } else {
                tablero[fila][columna] = 9;
                i++;
            }
        }
        // calcular el valor de las casillas que no son minas
        for (var i = 0; i < 10; i++) {
            for (var j = 0; j < 10; j++) {
                if (tablero[i][j] !== 9) {
                    var minas = 0;
                    for (var k = i - 1; k <= i + 1; k++) {
                        for (var l = j - 1; l <= j + 1; l++) {
                            if (k >= 0 && k < 10 && l >= 0 && l < 10 && tablero[k][l] === 9) {
                                minas++;
                            }
                        }
                    }
                    tablero[i][j] = minas;
                }
            }
        }
        // mostar el tablero en la página
        var tableroHTML = "";
        for (var i = 0; i < 10; i++) {
            tableroHTML += "<div>";
            for (var j = 0; j < 10; j++) {
                tableroHTML += "<button class=\"water\" onclick='descubrir(" + i + ", " + j + ")'>?</button>";
            }
            tableroHTML += "</div>";
        }
        document.getElementById("tablero").innerHTML = tableroHTML;
        // función para descubrir una casilla
        function descubrir(fila, columna) {
            // si el usuario está pulsando shift, marcar la casilla con un @
            if (event.shiftKey) {
                // si la casilla ya está marcada con @, quitar la marca
                if (document.getElementsByTagName("button")[fila * 10 + columna].innerText === "@") {
                    document.getElementsByTagName("button")[fila * 10 + columna].innerText = "?";
                    // sacar al boton de la clase "marcada"
                    document.getElementsByTagName("button")[fila * 10 + columna].classList.remove("marcada");
                } else {
                    document.getElementsByTagName("button")[fila * 10 + columna].innerText = "@";
                    // meter al boton en la clase "marcada"
                    document.getElementsByTagName("button")[fila * 10 + columna].classList.add("marcada");
                    // final: si todas las casillas que son minas están marcadas con @, mostrar un mensaje de victoria
                    var marcadas = 0;
                    for (var i = 0; i < 10; i++) {
                        for (var j = 0; j < 10; j++) {
                            if (tablero[i][j] === 9 && document.getElementsByTagName("button")[i * 10 + j].innerText === "@") {
                                marcadas++;
                            }
                        }
                    }
                    if (marcadas === 10) {
                        alert("¡Ganaste!");
                    }
                }
            } else {
                // si la casilla es una mina, mostrar todas las minas y mostrar un mensaje de derrota
                if (tablero[fila][columna] === 9) {
                    // descubririr todas las celdas y todas las minas
                    for (var i = 0; i < 10; i++) {
                        for (var j = 0; j < 10; j++) {
                            if (tablero[i][j] === 9) {
                                document.getElementsByTagName("button")[i * 10 + j].innerText = "X";
                                // colorear roja
                                document.getElementsByTagName("button")[i * 10 + j].style.backgroundColor = "red";
                            } else {
                                document.getElementsByTagName("button")[i * 10 + j].innerText = tablero[i][j];


                            }
                        }
                    }
                    alert("¡Perdiste!");
                } else {

                    //si la casilla ya está descubierta, no hacer nada
                    if (document.getElementsByTagName("button")[fila * 10 + columna].innerText !== "?") {
                        return;
                    } else {
                        // mostrar el valor de la casilla
                        document.getElementsByTagName("button")[fila * 10 + columna].innerText = tablero[fila][columna];
                        // colorear en función del valor de la casilla descubierta
                        if (fila >= 0 && fila < 10 && columna >= 0 && columna < 10) {
                            if (tablero[fila][columna] === 0) {
                                document.getElementsByTagName("button")[fila * 10 + columna].style.backgroundColor = gamaAzules[0];
                            }
                            if (tablero[fila][columna] === 1) {
                                document.getElementsByTagName("button")[fila * 10 + columna].style.backgroundColor = gamaAzules[1];
                            }
                            if (tablero[fila][columna] === 2) {
                                document.getElementsByTagName("button")[fila * 10 + columna].style.backgroundColor = gamaAzules[2];
                                document.getElementsByTagName("button")[fila * 10 + columna].style.color = "white";
                            }
                            if (tablero[fila][columna] === 3) {
                                document.getElementsByTagName("button")[fila * 10 + columna].style.backgroundColor = gamaAzules[3];
                                document.getElementsByTagName("button")[fila * 10 + columna].style.color = "white";
                            }
                            if (tablero[fila][columna] === 4) {
                                document.getElementsByTagName("button")[fila * 10 + columna].style.backgroundColor = gamaAzules[4];
                                document.getElementsByTagName("button")[fila * 10 + columna].style.color = "white";
                            }
                            if (tablero[fila][columna] === 5) {
                                document.getElementsByTagName("button")[fila * 10 + columna].style.backgroundColor = gamaAzules[5];
                                document.getElementsByTagName("button")[fila * 10 + columna].style.color = "white"; // Added color for value 5
                            }
                            if (tablero[fila][columna] === 6) {
                                document.getElementsByTagName("button")[fila * 10 + columna].style.backgroundColor = gamaAzules[6];
                                document.getElementsByTagName("button")[fila * 10 + columna].style.color = "white"; // Added color for value 6
                            }
                            if (tablero[fila][columna] === 7) {
                                document.getElementsByTagName("button")[fila * 10 + columna].style.backgroundColor = gamaAzules[7];
                                document.getElementsByTagName("button")[fila * 10 + columna].style.color = "white"; // Added color for value 7
                            }
                            if (tablero[fila][columna] === 8) {
                                document.getElementsByTagName("button")[fila * 10 + columna].style.backgroundColor = gamaAzules[8];
                                document.getElementsByTagName("button")[fila * 10 + columna].style.color = "white"; // Added color for value 8
                            }
                        }
                        // en el caso de que el valor sea 0, descubrir todas las casillas adyacentes que también sean 0
                        if (tablero[fila][columna] === 0) {
                            for (var i = fila - 1; i <= fila + 1; i++) {
                                for (var j = columna - 1; j <= columna + 1; j++) {
                                    if (i >= 0 && i < 10 && j >= 0 && j < 10) {
                                        if (document.getElementsByTagName("button")[i * 10 + j].innerText === "?") {
                                            descubrir(i, j);
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    </script>

</html>
